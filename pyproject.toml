[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ht-cn"
version = "0.1.0"
description = "HT-CN Local: local-first harmonic trading research toolkit for China A-shares"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "duckdb>=1.3,<2.0",
  "pyarrow>=20,<22",
  "pandas>=2.3,<3.0",
  "akshare>=1.18.94,<2.0",
  "baostock>=0.9.3,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "httpx>=0.28,<1.0",
  "ruff>=0.12,<1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

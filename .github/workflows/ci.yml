name: HT-CN CI

on:
  push:
    branches:
      - main
      - 'm*/**'
  pull_request:

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run Python tests
        run: python -m pytest -q

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build web
        working-directory: apps/web
        run: npm run build

  autonomous-research:
    name: autonomous-real-a-share-research
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/m2/')
    needs: deterministic-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore pinned A-share research snapshots
        uses: actions/cache@v4
        with:
          path: artifacts/ci-research/data
          key: m2-research-qfq-${{ runner.os }}-${{ hashFiles('research/a-share-research-universe-v1.json') }}
          restore-keys: |
            m2-research-qfq-${{ runner.os }}-

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run autonomous real A-share calibration
        run: python scripts/m2_ci_autonomous_research.py

      - name: Upload autonomous research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-autonomous-research-${{ github.sha }}
          path: artifacts/ci-research/
          if-no-files-found: warn
          retention-days: 30

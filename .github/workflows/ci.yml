name: HT-CN CI

on:
  push:
    branches:
      - main
      - 'm*/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: htcn-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Verify Project OS v2 state integrity
        run: python scripts/project_state.py

      - name: Verify M6.5 source coverage freeze
        run: python scripts/m6_verify_source_coverage.py

      - name: Enforce frozen Ruff debt budget
        run: python scripts/ruff_with_budget.py

      - name: Run Python tests
        run: python scripts/pytest_with_warning_budget.py

      - name: Build and verify portable chat continuation bundle
        run: python scripts/build_chat_continuation_bundle.py

      - name: Upload portable chat continuation bundle
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: htcn-chat-continuation-${{ github.sha }}
          path: |
            artifacts/reports/htcn-chat-continuation-bundle.zip
            logs/context/HTCN_CHAT_HANDOFF.md
            logs/context/HTCN_CHAT_HANDOFF.sha256
            logs/context/HTCN_NEW_CHAT_PROMPT.md
          if-no-files-found: error
          retention-days: 30

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build web
        working-directory: apps/web
        run: npm run build

      - name: Install Playwright Chromium for M5/M3/M2 source gates
        if: startsWith(github.ref, 'refs/heads/m5/') || startsWith(github.head_ref, 'm5/') || startsWith(github.ref, 'refs/heads/m3/') || startsWith(github.head_ref, 'm3/') || startsWith(github.ref, 'refs/heads/m2/source-') || startsWith(github.head_ref, 'm2/source-') || startsWith(github.ref, 'refs/heads/m2/five-zero-') || startsWith(github.head_ref, 'm2/five-zero-') || startsWith(github.ref, 'refs/heads/m2/shark-') || startsWith(github.head_ref, 'm2/shark-') || startsWith(github.ref, 'refs/heads/m2/rsi-') || startsWith(github.head_ref, 'm2/rsi-')
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run deterministic browser acceptance
        if: startsWith(github.ref, 'refs/heads/m5/') || startsWith(github.head_ref, 'm5/') || startsWith(github.ref, 'refs/heads/m3/') || startsWith(github.head_ref, 'm3/') || startsWith(github.ref, 'refs/heads/m2/source-') || startsWith(github.head_ref, 'm2/source-') || startsWith(github.ref, 'refs/heads/m2/five-zero-') || startsWith(github.head_ref, 'm2/five-zero-') || startsWith(github.ref, 'refs/heads/m2/shark-') || startsWith(github.head_ref, 'm2/shark-') || startsWith(github.ref, 'refs/heads/m2/rsi-') || startsWith(github.head_ref, 'm2/rsi-')
        working-directory: apps/web
        run: npx playwright test tests/smoke.spec.ts tests/lifecycle.spec.ts tests/execution-context.spec.ts tests/market-context.spec.ts tests/sector-context.spec.ts tests/concept-context.spec.ts tests/context-integrity.spec.ts tests/decision-narrative.spec.ts tests/decision-selection.spec.ts tests/operator-queue.spec.ts tests/operator-delta.spec.ts tests/operator-index.spec.ts tests/operator-history.spec.ts tests/daily-review-digest.spec.ts tests/review-followup-journal.spec.ts tests/human-workflow.spec.ts

      - name: Build M5 Phase18 portable visual browser fixture
        if: startsWith(github.ref, 'refs/heads/m5/') || startsWith(github.head_ref, 'm5/')
        run: python scripts/m5_build_portable_visual_browser_fixture.py

      - name: Run M5 Phase18 portable visual browser acceptance
        if: startsWith(github.ref, 'refs/heads/m5/') || startsWith(github.head_ref, 'm5/')
        working-directory: apps/web
        run: npx playwright test tests/portable-visual-workspace.spec.ts --reporter=list

      - name: Verify M5 Phase18 portable visual browser evidence
        if: startsWith(github.ref, 'refs/heads/m5/') || startsWith(github.head_ref, 'm5/')
        run: python scripts/m5_verify_portable_visual_browser_evidence.py

      - name: Prepare M5 Phase21 browser audit from deterministic fixture
        if: startsWith(github.ref, 'refs/heads/m5/') || startsWith(github.head_ref, 'm5/')
        run: python scripts/m5_prepare_main_real_browser_audit.py --fixture

      - name: Run M5 Phase21 dynamic portable delivery browser audit
        if: startsWith(github.ref, 'refs/heads/m5/') || startsWith(github.head_ref, 'm5/')
        working-directory: apps/web
        run: npx playwright test tests/main-real-portable-delivery.spec.ts --reporter=list

      - name: Verify M5 Phase21 browser audit evidence
        if: startsWith(github.ref, 'refs/heads/m5/') || startsWith(github.head_ref, 'm5/')
        run: python scripts/m5_verify_main_real_browser_evidence.py

      - name: Fetch full history for Phase21 freeze guards
        if: startsWith(github.ref, 'refs/heads/m5/main-real-closeout') || startsWith(github.head_ref, 'm5/main-real-closeout')
        run: git fetch --no-tags --prune --unshallow origin || git fetch --no-tags --prune origin

      - name: Verify M4 methodology freeze for Phase21 closeout
        if: startsWith(github.ref, 'refs/heads/m5/main-real-closeout') || startsWith(github.head_ref, 'm5/main-real-closeout')
        run: python scripts/m4_methodology_freeze_guard.py

      - name: Verify M4 Outcome Engine freeze for Phase21 closeout
        if: startsWith(github.ref, 'refs/heads/m5/main-real-closeout') || startsWith(github.head_ref, 'm5/main-real-closeout')
        run: python scripts/m4_outcome_engine_freeze_guard.py

      - name: Upload browser evidence
        if: always() && (startsWith(github.ref, 'refs/heads/m5/') || startsWith(github.head_ref, 'm5/') || startsWith(github.ref, 'refs/heads/m3/') || startsWith(github.head_ref, 'm3/') || startsWith(github.ref, 'refs/heads/m2/source-') || startsWith(github.head_ref, 'm2/source-') || startsWith(github.ref, 'refs/heads/m2/five-zero-') || startsWith(github.head_ref, 'm2/five-zero-') || startsWith(github.ref, 'refs/heads/m2/shark-') || startsWith(github.head_ref, 'm2/shark-') || startsWith(github.ref, 'refs/heads/m2/rsi-') || startsWith(github.head_ref, 'm2/rsi-'))
        uses: actions/upload-artifact@v4
        with:
          name: htcn-browser-evidence-${{ github.sha }}
          path: |
            artifacts/screenshots/
            artifacts/reports/playwright/
            artifacts/reports/m9-release-package.json
            artifacts/release/
          if-no-files-found: warn
          retention-days: 14


  main-release-integrity:
    name: formal-main-release-integrity
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    needs: deterministic-tests
    concurrency:
      group: htcn-main-release-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release candidate with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Verify Project OS v2 state integrity for formal release
        run: python scripts/project_state.py

      - name: Verify formal main release lineage
        run: python scripts/m5_main_release_integrity.py

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build web for formal main release
        working-directory: apps/web
        run: npm run build

      - name: Build and verify M9.5 product release package
        run: python scripts/m9_build_release_package.py --head ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Playwright Chromium for formal main release
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run existing deterministic browser acceptance for main release
        working-directory: apps/web
        run: npx playwright test tests/smoke.spec.ts tests/lifecycle.spec.ts tests/execution-context.spec.ts tests/market-context.spec.ts tests/sector-context.spec.ts tests/concept-context.spec.ts tests/context-integrity.spec.ts tests/decision-narrative.spec.ts tests/decision-selection.spec.ts tests/operator-queue.spec.ts tests/operator-delta.spec.ts tests/operator-index.spec.ts tests/operator-history.spec.ts tests/daily-review-digest.spec.ts tests/review-followup-journal.spec.ts tests/human-workflow.spec.ts tests/product-workbench.spec.ts tests/evidence-observability.spec.ts tests/product-reliability.spec.ts tests/stable-release.spec.ts

      - name: Build M5 Phase18 portable visual browser fixture for main release
        run: python scripts/m5_build_portable_visual_browser_fixture.py

      - name: Run M5 Phase18 portable visual browser acceptance for main release
        working-directory: apps/web
        run: npx playwright test tests/portable-visual-workspace.spec.ts --reporter=list

      - name: Verify M5 Phase18 browser evidence for main release
        run: python scripts/m5_verify_portable_visual_browser_evidence.py

      - name: Prepare M5 Phase21 browser audit fixture for main release
        run: python scripts/m5_prepare_main_real_browser_audit.py --fixture

      - name: Run M5 Phase21 dynamic browser audit for main release
        working-directory: apps/web
        run: npx playwright test tests/main-real-portable-delivery.spec.ts --reporter=list

      - name: Verify M5 Phase21 browser evidence for main release
        run: python scripts/m5_verify_main_real_browser_evidence.py

      - name: Verify M4 methodology freeze for main release
        run: python scripts/m4_methodology_freeze_guard.py

      - name: Verify M4 Outcome Engine freeze for main release
        run: python scripts/m4_outcome_engine_freeze_guard.py

      - name: Verify M9.6 stable product release acceptance
        run: python scripts/m9_stable_release_acceptance.py

      - name: Upload formal main release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htcn-main-release-integrity-${{ github.sha }}
          path: |
            artifacts/reports/m5-main-release-integrity.json
            artifacts/reports/m9-release-package.json
            artifacts/reports/m9-stable-release-acceptance.json
            artifacts/release/
            artifacts/screenshots/
            artifacts/reports/playwright/
          if-no-files-found: warn
          retention-days: 30

  integration-readiness:
    name: preserve-ancestry-integration-readiness
    if: startsWith(github.ref, 'refs/heads/m5/integration-readiness') || startsWith(github.head_ref, 'm5/integration-readiness')
    needs: deterministic-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration head with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Fetch exact main ref
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Verify preserve-ancestry integration graph
        run: python scripts/m5_integration_readiness.py --main-ref origin/main

      - name: Verify M4 methodology freeze at integration head
        run: python scripts/m4_methodology_freeze_guard.py

      - name: Verify M4 Outcome Engine freeze at integration head
        run: python scripts/m4_outcome_engine_freeze_guard.py

      - name: Upload integration readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htcn-integration-readiness-${{ github.sha }}
          path: artifacts/reports/m5-integration-readiness.json
          if-no-files-found: warn
          retention-days: 30

  autonomous-research:
    name: autonomous-real-a-share-research
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/m2/') && contains(github.event.head_commit.message, '[research]'))
      || github.event_name == 'workflow_dispatch'
    needs: deterministic-tests
    concurrency:
      group: htcn-research-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore pinned A-share research snapshots
        id: research-cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/ci-research/data
          key: m2-research-qfq-${{ runner.os }}-${{ hashFiles('research/a-share-research-universe-v1.json') }}
          restore-keys: |
            m2-research-qfq-${{ runner.os }}-

      - name: Bootstrap frozen A-share snapshots on cache miss
        id: research-bootstrap
        if: steps.research-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: m2-autonomous-research-80421ff54cb0338906a3d34e5242740ec2d3469d
          repository: shazhuya/HT-CN
          run-id: 35114589602
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/ci-research

      - name: Persist bootstrapped frozen snapshots immediately
        if: steps.research-cache.outputs.cache-hit != 'true' && steps.research-bootstrap.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: artifacts/ci-research/data
          key: m2-research-qfq-${{ runner.os }}-${{ hashFiles('research/a-share-research-universe-v1.json') }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run autonomous real A-share calibration
        run: python -u scripts/m2_ci_autonomous_research.py

      - name: Save fetched A-share research snapshots after calibration
        if: steps.research-cache.outputs.cache-hit != 'true' && steps.research-bootstrap.outcome != 'success'
        uses: actions/cache/save@v4
        with:
          path: artifacts/ci-research/data
          key: m2-research-qfq-${{ runner.os }}-${{ hashFiles('research/a-share-research-universe-v1.json') }}

      - name: Report source-Raw-PRZ Terminal Price Bar calibration v6
        run: python scripts/m2_terminal_bar_report.py

      - name: Report source-backed Type-I early-path evidence v6
        run: python scripts/m2_type_i_confirmation_report.py

      - name: Stress-test Type-I early-path evidence v6
        run: python scripts/m2_type_i_robustness_report.py

      - name: Resolve nested T+3/T+5 Type-I exit timing v6
        run: python scripts/m2_type_i_exit_timing_report.py

      - name: Verify source-PRZ v6 sealed research boundary
        run: python scripts/m2_source_prz_v6_research_guard.py

      - name: Observe RSI BAMM on frozen real A-share snapshots
        run: python scripts/m2_rsi_bamm_observability.py

      - name: Verify frozen Type-I Holdout pre-registration v1
        run: python scripts/m2_type_i_holdout_prereg_report.py

      - name: Verify frozen one-time Type-I Holdout result
        run: python scripts/m2_type_i_holdout_result_report.py

      - name: Verify frozen external Type-I replication pre-registration
        run: python scripts/m2_type_i_external_prereg_report.py

      - name: Verify frozen one-time external Type-I replication result
        run: python scripts/m2_type_i_external_result_report.py

      - name: Build completed-reaction quality evidence
        run: python scripts/m2_completed_reaction_quality.py

      - name: Stress-test completed-reaction quality evidence
        run: python scripts/m2_completed_reaction_robustness.py

      - name: Upload autonomous research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-autonomous-research-${{ github.sha }}
          path: artifacts/ci-research/
          if-no-files-found: warn
          retention-days: 30

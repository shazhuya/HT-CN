name: M6.4 Ruff Safe Autofix

on:
  push:
    branches:
      - m6/repository-governance-v1

permissions:
  contents: write

jobs:
  safe-ruff-autofix:
    if: "!contains(github.event.head_commit.message, 'M6.4: apply safe Ruff autofixes')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install locked development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock

      - name: Apply Ruff safe fixes only
        run: |
          python -m ruff check . --fix || true

      - name: Report remaining Ruff violations
        run: |
          python -m ruff check . --output-format concise > /tmp/ruff-remaining.txt || true
          echo "===== REMAINING RUFF ====="
          wc -l /tmp/ruff-remaining.txt
          cat /tmp/ruff-remaining.txt

      - name: Commit safe mechanical fixes
        run: |
          if git diff --quiet; then
            echo "No Ruff safe-fix changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "M6.4: apply safe Ruff autofixes"
          git push origin HEAD:m6/repository-governance-v1

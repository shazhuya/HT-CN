name: M6.4 Ruff Residual Report

on:
  push:
    branches:
      - m6/repository-governance-v1

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
      - name: Report exact residual Ruff findings
        run: |
          python -m ruff check . --output-format concise || true

name: Recognition Gate 3 Fast

on:
  push:
    branches:
      - m9/recognition-trustworthiness-v1
    paths:
      - "src/htcn/harmonic/**"
      - "scripts/m9_recognition_synthetic_real_gate.py"
      - "research/a-share-research-universe-v1.json"
      - ".github/workflows/recognition-gate3-fast.yml"
  workflow_dispatch:

concurrency:
  group: htcn-recognition-gate3-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate3:
    name: recognition-gate3-fast
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore pinned A-share research snapshots
        id: recognition-snapshot-cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/ci-research/data
          key: m2-research-qfq-${{ runner.os }}-${{ hashFiles('research/a-share-research-universe-v1.json') }}
          restore-keys: |
            m2-research-qfq-${{ runner.os }}-

      - name: Bootstrap frozen snapshots on cache miss
        if: steps.recognition-snapshot-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: m2-autonomous-research-80421ff54cb0338906a3d34e5242740ec2d3469d
          repository: shazhuya/HT-CN
          run-id: 35114589602
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/ci-research

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Run Gate 3 directly
        run: python -u scripts/m9_recognition_synthetic_real_gate.py

      - name: Upload Gate 3 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htcn-recognition-gate3-fast-${{ github.sha }}
          path: artifacts/reports/m9-recognition-synthetic-real-gate.json
          if-no-files-found: warn
          retention-days: 30

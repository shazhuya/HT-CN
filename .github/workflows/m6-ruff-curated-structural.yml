name: M6.4 Curated Ruff Structural Fixes

on:
  push:
    branches:
      - m6/repository-governance-v1

permissions:
  contents: write

jobs:
  curated-structural-fixes:
    if: "!contains(github.event.head_commit.message, 'M6.4: apply curated structural Ruff fixes')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install locked development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock

      - name: Apply only curated structural transformations
        run: |
          python -m ruff check . --fix --unsafe-fixes --select RUF007,C401,SIM102,UP022,ISC004 || true

      - name: Commit curated transformations
        run: |
          if git diff --quiet; then
            echo "No curated transformations available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "M6.4: apply curated structural Ruff fixes"
          git push origin HEAD:m6/repository-governance-v1

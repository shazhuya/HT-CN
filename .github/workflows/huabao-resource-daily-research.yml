name: huabao-resource-daily-research
on:
  push:
    branches:
      - research/huabao-resource-20260923
    paths:
      - research/huabao_resource_20260923.py
  pull_request:
    branches:
      - main
    paths:
      - research/huabao_resource_20260923.py
      - .github/workflows/huabao-resource-daily-research.yml
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/huabao-resource-20260923
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chinese fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install pandas numpy matplotlib requests openpyxl akshare scipy
      - name: Run exact daily research
        run: python research/huabao_resource_20260923.py
      - name: Commit research outputs to temporary research branch
        run: |
          git config user.name "chatgpt-research"
          git config user.email "chatgpt-research@users.noreply.github.com"
          git add research/output_huabao_20260923
          git commit -m "Research: exact daily Huabao resource data and analysis" || exit 0
          git push origin HEAD:research/huabao-resource-20260923
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: huabao-resource-daily-research
          path: research/output_huabao_20260923
          if-no-files-found: error
